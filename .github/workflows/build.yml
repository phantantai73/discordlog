name: Build Discord Log Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Cập nhật lên @v5 để tương thích Node 24
      - name: Checkout code
        uses: actions/checkout@v5

      # Cập nhật lên @v5 và đảm bảo dùng Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build

      # Cập nhật lên @v5 để tương thích Node 24
      - name: Upload JAR
        uses: actions/upload-artifact@v5
        with:
          name: discordlog-mod
          path: build/libs/*.jar
